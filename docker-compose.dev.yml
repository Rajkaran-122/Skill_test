# ============================================================
# Store Intelligence Platform — Docker Compose (Development)
# ============================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ============================================================

services:
  cv-pipeline:
    build:
      target: development
    volumes:
      - ./services/cv-pipeline/src:/app/src
    environment:
      YOLO_DEVICE: cpu
      LOG_LEVEL: DEBUG

  event-processor:
    build:
      target: development
    volumes:
      - ./services/event-processor/src:/app/src
    environment:
      LOG_LEVEL: DEBUG

  api:
    build:
      target: development
    volumes:
      - ./services/api/src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      LOG_LEVEL: DEBUG
      DEBUG: "true"

  dashboard:
    build:
      target: development
    volumes:
      - ./services/dashboard/src:/app/src
      - ./services/dashboard/public:/app/public
    command: npm run dev -- --host 0.0.0.0 --port 3000

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
