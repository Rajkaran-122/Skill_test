# ============================================================
# Store Intelligence Platform — Docker Compose (Production)
# ============================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:
  cv-pipeline:
    build:
      target: production
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      YOLO_DEVICE: cuda:0
      LOG_LEVEL: WARNING

  event-processor:
    build:
      target: production
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    environment:
      LOG_LEVEL: WARNING

  api:
    build:
      target: production
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
      replicas: 2
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      LOG_LEVEL: WARNING
      DEBUG: "false"

  dashboard:
    build:
      target: production

  postgres:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  redis:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  kafka:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
