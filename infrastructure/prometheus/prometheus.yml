# ============================================================
# Store Intelligence Platform — Prometheus Configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # FastAPI metrics
  - job_name: "sip-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api"
          environment: "development"

  # CV Pipeline metrics
  - job_name: "sip-cv-pipeline"
    metrics_path: /metrics
    static_configs:
      - targets: ["cv-pipeline:8001"]
        labels:
          service: "cv-pipeline"
          environment: "development"

  # Event Processor metrics
  - job_name: "sip-event-processor"
    metrics_path: /metrics
    static_configs:
      - targets: ["event-processor:8002"]
        labels:
          service: "event-processor"
          environment: "development"

  # Redis metrics (via Redis exporter, if added)
  # - job_name: "sip-redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Kafka metrics (via JMX exporter, if added)
  # - job_name: "sip-kafka"
  #   static_configs:
  #     - targets: ["kafka:7071"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
